name: Delete All Benchmarks

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_ALL to confirm deletion of every benchmark file'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        if: ${{ github.event.inputs.confirmation != 'DELETE_ALL' }}
        run: |
          echo "Confirmation input was '${{ github.event.inputs.confirmation }}', expected DELETE_ALL."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete benchmark files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch benchmarks/ docs/public/benchmarks-data/
          if git diff --cached --quiet; then
            echo "No benchmark files found — nothing to delete."
            exit 0
          fi
          git commit -m "chore: delete all benchmarks"
          git push

      - name: Delete all files from source benchmarks repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/BitBull-capital/benchmarks.git" /tmp/benchmarks-src
          cd /tmp/benchmarks-src

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch benchmarks/

          python3 -c "import re; h='| Strategy | Timeframe | Period | Trades | Profit % | Winrate % | Sharpe | Max DD % |\n|----------|-----------|--------|--------|----------|-----------|--------|----------|\n'; txt=open('README.md').read(); txt=re.sub(r'(?<=BENCHMARK_TABLE_START -->\n).*?(?=<!-- BENCHMARK_TABLE_END)', h, txt, flags=re.DOTALL); open('README.md','w').write(txt)"
          git add README.md

          if git diff --cached --quiet; then
            echo "BitBull-capital/benchmarks is already empty — nothing to delete."
          else
            git commit -m "chore: delete all benchmarks"
            git push
          fi
