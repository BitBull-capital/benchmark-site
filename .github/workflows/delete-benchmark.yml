name: Delete Benchmark

on:
  workflow_dispatch:
    inputs:
      strategy_name:
        description: 'Strategy name as shown on the site (e.g. sw_sl2_t20_o3)'
        required: true
      timeframe:
        description: 'Timeframe to delete (choose "all" to delete every timeframe)'
        required: true
        type: choice
        options:
          - all
          - 1m
          - 5m
          - 15m
          - 30m

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available strategies
        run: |
          echo "Available strategies in benchmarks/:"
          for meta in benchmarks/*.meta.json; do
            [ -f "$meta" ] || continue
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); [print('  '+k+'  ('+v.get('timeframe','?')+')  '+sys.argv[1]) for k,v in d.items()]" "$meta"
          done

      - name: Find and delete benchmarks for strategy
        env:
          STRATEGY: ${{ github.event.inputs.strategy_name }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: |
          matched=()
          for meta in benchmarks/*.meta.json; do
            [ -f "$meta" ] || continue
            if python3 -c "import json,os,sys; d=json.load(open(sys.argv[1])); s=os.environ['STRATEGY']; tf=os.environ['TIMEFRAME']; sys.exit(0 if s in d and (tf=='all' or d[s].get('timeframe')==tf) else 1)" "$meta"; then
              matched+=("${meta%.meta.json}")
            fi
          done

          if [ ${#matched[@]} -eq 0 ]; then
            echo "No benchmarks found for strategy '${STRATEGY}' / timeframe '${TIMEFRAME}'. Aborting."
            exit 1
          fi

          echo "Deleting ${#matched[@]} benchmark(s) for strategy '${STRATEGY}' (timeframe: ${TIMEFRAME}):"
          for base in "${matched[@]}"; do
            echo "  - $(basename "$base")"
          done

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for base in "${matched[@]}"; do
            id="$(basename "$base")"
            git rm --ignore-unmatch "${base}.zip" "${base}.meta.json" \
              "docs/public/benchmarks-data/${id}.json"
          done

          if [ "${TIMEFRAME}" = "all" ]; then
            msg="chore: delete benchmarks for strategy ${STRATEGY}"
          else
            msg="chore: delete benchmarks for strategy ${STRATEGY} (${TIMEFRAME})"
          fi
          git commit -m "$msg"
          git push

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh workflow run deploy.yml --ref master
