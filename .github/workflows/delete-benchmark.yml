name: Delete Benchmark

on:
  workflow_dispatch:
    inputs:
      strategy_name:
        description: 'Strategy name as shown on the site (e.g. orb, sw_sl2_t20_o3)'
        required: true
      timeframe:
        description: 'Timeframe to delete (choose "all" to delete every timeframe)'
        required: true
        type: choice
        options:
          - all
          - 1m
          - 5m
          - 15m
          - 30m

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available strategies
        run: |
          echo "Available strategies in benchmarks/:"
          for zip in benchmarks/backtest-result-*.zip; do
            [ -f "$zip" ] || continue
            id="$(basename "${zip%.zip}")"
            unzip -p "$zip" "${id}.json" 2>/dev/null > /tmp/bench_tmp.json || continue
            python3 -c "import json,sys; [print('  '+st.get('strategy_name','?')+'  ('+st.get('timeframe','?')+')  '+sys.argv[1]) for st in json.load(open('/tmp/bench_tmp.json')).get('strategy',{}).values()]" "$zip"
          done

      - name: Find and delete benchmarks for strategy
        env:
          STRATEGY: ${{ github.event.inputs.strategy_name }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: |
          matched=()
          for zip in benchmarks/backtest-result-*.zip; do
            [ -f "$zip" ] || continue
            id="$(basename "${zip%.zip}")"
            unzip -p "$zip" "${id}.json" 2>/dev/null > /tmp/bench_tmp.json || continue
            if python3 -c "import json,os,sys; d=json.load(open('/tmp/bench_tmp.json')); s=os.environ['STRATEGY']; tf=os.environ['TIMEFRAME']; [sys.exit(0) for st in d.get('strategy',{}).values() if st.get('strategy_name')==s and (tf=='all' or st.get('timeframe')==tf)]; sys.exit(1)"; then
              matched+=("benchmarks/$id")
            fi
          done

          if [ ${#matched[@]} -eq 0 ]; then
            echo "No benchmarks found for strategy '${STRATEGY}' / timeframe '${TIMEFRAME}' — nothing to delete."
            exit 0
          fi

          echo "Deleting ${#matched[@]} benchmark(s) for strategy '${STRATEGY}' (timeframe: ${TIMEFRAME}):"
          for base in "${matched[@]}"; do
            echo "  - $(basename "$base")"
          done

          for base in "${matched[@]}"; do
            echo "$(basename "$base")" >> /tmp/matched_ids.txt
          done

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for base in "${matched[@]}"; do
            id="$(basename "$base")"
            git rm --ignore-unmatch "${base}.zip" "${base}.meta.json" \
              "docs/public/benchmarks-data/${id}.json"
          done

          if [ "${TIMEFRAME}" = "all" ]; then
            msg="chore: delete benchmarks for strategy ${STRATEGY}"
          else
            msg="chore: delete benchmarks for strategy ${STRATEGY} (${TIMEFRAME})"
          fi
          git commit -m "$msg"
          git push

      - name: Delete from source benchmarks repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STRATEGY: ${{ github.event.inputs.strategy_name }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: |
          if [ ! -f /tmp/matched_ids.txt ]; then
            echo "No matches found earlier — skipping cross-repo deletion."
            exit 0
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/BitBull-capital/benchmarks.git" /tmp/benchmarks-src
          cd /tmp/benchmarks-src

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r id; do
            git rm -r --ignore-unmatch "benchmarks/${id}"
            sed -i "/${id}/d" README.md
          done < /tmp/matched_ids.txt
          git add README.md

          if git diff --cached --quiet; then
            echo "No matching files found in BitBull-capital/benchmarks — skipping."
          else
            if [ "${TIMEFRAME}" = "all" ]; then
              msg="chore: delete benchmarks for strategy ${STRATEGY}"
            else
              msg="chore: delete benchmarks for strategy ${STRATEGY} (${TIMEFRAME})"
            fi
            git commit -m "$msg"
            git push
          fi
